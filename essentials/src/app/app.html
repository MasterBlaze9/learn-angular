<app-header></app-header>

<main>
  <ul id="users">
    @for (user of users; track user.id) {
      <li>
        <app-user [user]="user" [seleted]="user.id === selectedUser?.id" (selectedUser)="onSelectUser($event)" />
      </li>
    }
  </ul>

  @if (selectedUser) {
    <app-tasks [user]="selectedUser"></app-tasks>
  } @else {
    <p id="fallback">Select a user to see their tasks!</p>
  }
</main>
