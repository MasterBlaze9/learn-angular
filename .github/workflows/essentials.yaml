name: Essentials App CI
on:
  push:
    branches: [main]
    paths:
      - "essentials/**"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./essentials
    steps:
      - uses: actions/checkout@v4

      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: essentials/package-lock.json
      - name: Dependency Install
        run : npm ci

      - name: Run Tests
        run : npx ng test --watch=false --browsers=ChromeHeadless
      
      - name: Production build
        run: npx ng build --configuration production
